version: 1

# CI-Engineering owns the fleet-qa implementation. This file is the portable
# operator contract that tells each harness how to invoke it safely.
source:
  repository: companionintelligence/CI-Engineering
  root: tools/fleet-qa
  mcp_entrypoint: tools/mcp-server.mjs
  roster: tools/fleet-qa/skills/run-fleet-qa/fleet.json
  hub_root_env: [HUB_ROOT, COMPANION_HUB_ROOT, CI_HUB_ROOT]
  read_only_routes:
    readiness: /api/readiness.json
    manifest: /api/run.json
    snapshot: mcp://fleet_qa_snapshot

credential:
  provider: companion-hub-fleet-qa
  env: FLEET_HUB_API_KEYS_JSON
  item: agent-configs-companion-hub-fleet-qa
  format: json_map
  purpose: per-node Hub local keys used for pool-routing evidence
  never_print: true

target_policy:
  require_explicit_selector: true
  selector_fields: [nodes, all]
  implicit_all: false
  preserve_disabled_or_excluded_nodes: true
  use_tailscale_names_from: integrations/fleet/targets.yaml

suites:
  llm:
    modes: [llm, agent]
    mutates_nodes: false
    confirmation: not_required
    purpose: model availability, inference routing, and harmless agent coding probes
  apps:
    modes: [quick, full]
    mutates_nodes: true
    confirmation: required
    purpose: Companion Hub marketplace app install/start/health and platform journeys

mcp_tools:
  - fleet_qa_capabilities
  - fleet_qa_readiness
  - fleet_qa_manifest
  - fleet_qa_status
  - fleet_qa_start
  - fleet_qa_preflight
  - fleet_qa_inventory
  - fleet_qa_pool_scan
  - fleet_qa_evidence
  - fleet_qa_snapshot
  - fleet_qa_stop
  - fleet_qa_reset

sequence:
  - fleet_qa_capabilities
  - fleet_qa_readiness
  - fleet_qa_manifest
  - fleet_qa_status
  - fleet_qa_preflight
  - fleet_qa_inventory
  - fleet_qa_pool_scan
  - fleet_qa_start
  - fleet_qa_evidence
  - fleet_qa_snapshot
  - fleet_qa_stop

cli_only:
  - journeys require the fleet-qa CLI with --execute and --lock
  - pool-drills require the fleet-qa CLI with --execute and --lock
  - do not infer execution from an evidence resource or a read-only MCP call

evidence:
  resources: [manifest, readiness, status, results, llm, pool, provenance, journeys, drills]
  required_fields: [target, suite, mode, provider_or_backend, model_or_app, result, timestamp]
  redact: [api_keys, bearer_tokens, cookies, oauth_sessions, native_app_state]
