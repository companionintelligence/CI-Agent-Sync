version: 1

policy:
  default_state: disabled_until_reviewed
  credentials: keychain_or_native_oauth
  network: loopback_or_explicitly_approved_remote
  stdio: pin_package_versions_and_executable_paths
  destructive_tools: require_client_approval

servers:
  companion-hub:
    owner: companionintelligence/Companion-Hub
    source_repository: https://github.com/companionintelligence/Companion-Hub
    transport: streamable-http
    url: "${COMPANION_HUB_BASE_URL}/api/mcp"
    auth:
      provider: companion-hub
      header: Authorization
      format: "Bearer ${COMPANION_HUB_API_KEY}"
      scopes: [mcp]
      capability: read
    clients: [vscode, claude, codex, opencode, hermes, openclaw]
    optional_clients: [aider-desk, pi]
    state: opt_in
    notes: "Companion Hub control-plane MCP. Enable MCP in Hub, mint a scoped mcp key, and use read capability by default. Pair it with the separate qa:read and inference keys for the operator control room; write and full keys are never default."

  companion-memory:
    owner: companionintelligence/Companion-Memory
    source_repository: https://github.com/companionintelligence/Companion-Memory
    transport: streamable-http
    url: "${COMPANION_MEMORY_BASE_URL}/api/mcp"
    auth:
      provider: companion-memory
      header: Authorization
      format: "Bearer ${COMPANION_MEMORY_API_KEY}"
      scopes: [mcp, intents]
      capability: read
    clients: [vscode, claude, codex, openclaw, hermes]
    optional_clients: [opencode, aider-desk, pi]
    state: opt_in
    notes: "Companion Memory MCP. The external appliance URL is /api/mcp; use agent-configs-companion-memory with mcp + intents and read capability. The native CLI uses the separate full agent-configs-companion-memory-cli key because GraphQL is outside scoped routes."

  ci-brand-studio:
    owner: companionintelligence/CI-Brand-Studio
    source_repository: https://github.com/companionintelligence/CI-Brand-Studio
    transport: stdio
    command: node
    args: ["${CI_BRAND_STUDIO_ROOT}/asset-engine/apps/dashboard/mcp.mjs", --start]
    bind: loopback
    clients: [claude, codex, opencode, vscode]
    optional_clients: [hermes, openclaw, aider-desk, pi]
    state: opt_in
    notes: "The current origin/main MCP entrypoint is the Asset Engine dashboard server. It is local stdio, starts or attaches to a loopback dashboard, and requires confirmation for writes, approvals, services, and renders."

  ci-engineering:
    owner: companionintelligence/CI-Engineering
    source_repository: https://github.com/companionintelligence/CI-Engineering
    transport: stdio
    command: node
    args: ["${CI_ENGINEERING_ROOT}/tools/mcp-server.mjs", --start]
    env:
      CI_WORKSPACE: "${CI_ROOT}"
      HUB_ROOT: "${HUB_ROOT}"
      CI_HUB_ROOT: "${CI_HUB_ROOT}"
      COMPANION_HUB_ROOT: "${COMPANION_HUB_ROOT}"
      FLEET_HUB_API_KEYS_JSON: "${FLEET_HUB_API_KEYS_JSON}"
    bind: loopback
    clients: [claude, codex, opencode, vscode]
    optional_clients: [hermes, openclaw, aider-desk, pi, antigravity]
    state: opt_in
    notes: "Engineering, product-video, and guarded fleet-qa MCP. fleet_qa_* requires an explicit nodes list or all:true; marketplace app-suite control also requires confirm:true. Resolve FLEET_HUB_API_KEYS_JSON from agent-configs-companion-hub-fleet-qa only in the MCP process; confirmation remains server-side."

  ci-common:
    owner: companionintelligence/CI-Common
    transport: stdio
    command: node
    args: ["${CI_COMMON_ROOT}/apps/dashboard/mcp.mjs", --start]
    env:
      CI_WORKSPACE: "${CI_ROOT}"
    bind: loopback
    clients: [claude, codex, opencode, vscode]
    optional_clients: [hermes]
    notes: "Shared dashboard, campaign, social, and product-video surface. Mutations require confirm: true; keep the Hermes profile lean unless explicitly enabled."

  metricool:
    owner: metricool
    transport: streamable-http
    url: https://ai.metricool.com/mcp
    auth: host_oauth
    setup_guide: https://help.metricool.com/how-to-connect-metricools-mcp-eqp9h
    clients: [claude, codex, opencode, vscode]
    optional_clients: [hermes]
    notes: "Use the URL/OAuth flow for supported clients and authorize only trusted tools. Metricool grants broad account access within plan limits; publishing and scheduling remain approval-gated."

  android-remote-control:
    owner: danielealbano/android-remote-control-mcp
    transport: streamable-http
    url: "${ANDROID_MCP_URL:-http://127.0.0.1:8080/mcp}"
    auth: bearer_or_oauth
    headers:
      Authorization: "Bearer ${ANDROID_MCP_TOKEN}"
    source_repository: https://github.com/danielealbano/android-remote-control-mcp
    setup_guide: https://github.com/danielealbano/android-remote-control-mcp#setup
    clients: [claude, codex, opencode, vscode]
    optional_clients: [hermes, openclaw, antigravity]
    state: opt_in
    bind: device-local-by-default
    notes: "High-risk device-control MCP. Runs on Android with Accessibility access. Prefer adb port forwarding to a loopback host; use a public HTTPS tunnel only when explicitly required. Restrict tools and stop the server when not in use."

  nanokvm-beta-ms-a2-kvm:
    owner: Sipeed NanoKVM
    transport: streamable-http
    url: https://beta-ms-a2-kvm.capybara-ulmer.ts.net/api/mcp
    auth:
      provider: environment
      env: NANOKVM_BETA_MS_A2_KVM_API_KEY
      header: Authorization
      format: "Bearer ${NANOKVM_BETA_MS_A2_KVM_API_KEY}"
    setup_guide: https://wiki.sipeed.com/hardware/en/kvm/NanoKVM/mcp.html
    clients: [claude, codex]
    state: opt_in
    bind: trusted-tailnet
    notes: "Remote keyboard, display, power, and virtual-media control. Confirm the named KVM target before every operation."

  nanokvm-core-14-kvm:
    owner: Sipeed NanoKVM
