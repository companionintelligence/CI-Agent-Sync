version: 1

# IP-KVM dongles on the tailnet. Tailnet names are the identifiers; the
# address of each device is resolved by Tailscale DNS and is not stored here.
# `controls` is an inference from the naming convention (<node>-kvm) and stays
# unverified until someone confirms the cable-level mapping on the device.
observed_at: "2026-11-12"

policy:
  probe_is_read_only: true        # agentctl kvm status issues GET only, with no credentials
  credentials_in_1password: true  # one item per target: agent-configs-kvm-<target>, field `credential`
  mcp_requires_review: true       # a registered MCP client gets device control; review before enabling
  respect_operator_exclusions: true

targets:
  core-4-kvm:
    model: nanokvm
    controls: core-4
    controls_verified: false
    enabled: true
    notes: "NanoKVM. Probe state not recorded."

  core-5-kvm:
    model: nanokvm
    controls: core-5
    controls_verified: false
    enabled: true
    excluded_from_mcp: true
    notes: "NanoKVM. Blocked until an operator reviews the host identity. Match by tailnet name, not hostname alone."

  core-7-kvm:
    model: nanokvm
    controls: core-7
    controls_verified: false
    enabled: true
    excluded_from_mcp: true
    notes: "NanoKVM. Operator exclusion; do not give it an MCP client until the exclusion is lifted."

  core-14-kvm:
    model: nanokvm
    controls: core-14
    controls_verified: false
    enabled: true
    notes: "NanoKVM. Probe state not recorded."

  core-17-kvm:
    model: nanokvm
    controls: core-17
    controls_verified: false
    enabled: true
    notes: "NanoKVM. Probe state not recorded."

  beta-ms-a2-kvm:
    model: nanokvm
    controls: beta-ms-a2
    controls_verified: false
    enabled: true
    notes: "NanoKVM. Probe state not recorded."

  beta-kvm-1:
    model: pikvm
    controls: unknown
    controls_verified: false
    enabled: true
    notes: "PiKVM. Probe state not recorded."

  beta-kvm-2:
    model: pikvm
    controls: unknown
    controls_verified: false
    enabled: true
    notes: "PiKVM. Probe state not recorded."
