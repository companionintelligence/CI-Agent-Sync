version: 1

policy:
  install: review_source_and_capabilities_before_install
  credentials: native_store_or_agent-store_keychain_injection
  copy_native_state: false

plugins:
  - id: github/awesome-copilot/skill-image-gen
    host: vscode
    source: vscode-agent-plugin
    observed: installed
    install: review in the VS Code agent plugin UI

  - id: github/awesome-copilot/ai-team-orchestration
    host: vscode
    source: vscode-agent-plugin
    observed: installed
    install: review in the VS Code agent plugin UI

  - id: codex@openai-codex
    host: claude
    source: claude-plugin
    observed: enabled
    validation: claude plugin validate ~/.claude/skills

  - id: "@companionintelligence/openclaw-memory"
    host: openclaw
    source: npm
    owner: companionintelligence/CI-OpenClaw
    install: openclaw plugins install npm:@companionintelligence/openclaw-memory --accept-capabilities
    requires: [companion-memory-url, companion-memory-api-key]

  - id: omniroute
    host: opencode
    source: local
    observed: desktop config references a local plugin
    requires: [loopback-gateway, gateway-access-key]
    notes: Keep loopback binding; do not claim routing is operational until /v1/models returns 200.

  - id: "@vymalo/opencode-oauth2"
    host: opencode
    source: npm
    owner: ADORSYS-GIS/lightbridge-opencode-toolbeit
    observed: candidate_not_installed
    install: review the package, then add it to the opencode.json plugin array
    requires: [identity-provider-client-config]
    notes: OAuth2 gateway auth. Do not stack with repo-auth on one provider (both set Authorization). The same toolbelt's browser plugin controls a real browser profile; treat it as high-risk and opt-in with a throwaway profile.

  - id: metricool
    host: codex
    source: codex-app-plugin
    observed: available_not_connected
    install: connect through the Codex plugin manager, or use the native Metricool MCP recipe
    requires: [metricool-account-auth]
    capabilities: [social-analytics, scheduling, publishing]
    notes: Useful for the marketing feedback loop. Keep scheduling and publishing owner-approved.

  - id: runway
    host: codex
    source: codex-app-plugin
    observed: available_not_connected
    install: connect through the Codex plugin manager after reviewing generation permissions
    capabilities: [generative-video]
    notes: Optional candidate for creative ideation and motion assets; not required for the deterministic product-video pipeline.

  - id: heygen
    host: codex
    source: codex-app-plugin
    observed: available_not_connected
    install: connect through the Codex plugin manager after reviewing avatar and media permissions
    capabilities: [avatar-video, voice-video]
    notes: Optional candidate for presenter or avatar variants; not enabled by the portable workflow.

  - id: danielealbano/android-remote-control-mcp
    host: android
    source: github
    observed: reviewed_not_installed
    install: install the GMS or FOSS APK from a reviewed release, then configure the device locally
    requires: [android-device, accessibility-service, explicit-device-auth]
    capabilities: [android-ui-control, screenshots, files, apps, camera, notifications]
    notes: High-risk remote-control surface. Do not enable automatically or copy bearer tokens from external documents.
