version: 1

policy:
  source: reviewed_repository_or_native_agent_store
  install_mode: audit_then_explicit_install
  copy_native_state: false
  trust: read_skill_instructions_before_execution

# Skills every harness should carry by default. Installs stay audit-then-explicit:
# `agentctl validate` only checks that each harness has a declared install path.
default_skills:
  - id: humanizer
    repository: blader/humanizer
    license: MIT
    # Pin to a reviewed commit; bump only after reading the new SKILL.md.
    pinned_commit: 8c307f367c91bd974002f10f2be2965d642c13df
    skill_file: SKILL.md
    purpose: Rewrite AI-sounding prose to read as human-written without changing meaning
    review: read SKILL.md before install; it is prose guidance only and must not run scripts without approval
    installs:
      claude: /plugin marketplace add blader/humanizer, then /plugin install humanizer@humanizer (Claude Code 2.1.142+); older versions use npx skills add blader/humanizer --global --agent claude-code
      codex: npx skills add blader/humanizer --global --agent codex
      opencode: copy SKILL.md to ~/.config/opencode/skills/humanizer/SKILL.md
      hermes: copy SKILL.md to ~/.hermes/skills/humanizer/SKILL.md
      openclaw: copy SKILL.md to ~/.openclaw/skills/humanizer/SKILL.md
      vscode: npx skills add blader/humanizer --global --agent github-copilot
      antigravity: npx skills add blader/humanizer --global --agent '*'
      pi: copy SKILL.md to ~/.pi/skills/humanizer/SKILL.md
      aider-desk: copy SKILL.md into the app's skills folder; verify the path in the app first
      chatgpt: download the repo ZIP and upload it as a skill in the app settings
    not_applicable: [ollama]

sources:
  - id: companion-hub-agent-skills
    repository: companionintelligence/Companion-Hub
    ref: dev
    paths:
      - .claude/skills
      - .cursor/skills
    skills: [agent-workflow, agent-loop, agent-sweep, test-audit, visual-regression, hot-swap]
    validation: bin/agent-validate-shift

  - id: companion-memory-agent-skills
    repository: companionintelligence/Companion-Memory
    ref: main
    paths: [.cursor/skills]
    skills: [hot-swap]
    validation: make check

  - id: common-design-skills
    repository: companionintelligence/CI-Common
    ref: main
    paths: [.claude/skills, content/skills]
    skills: [ci-design-canon, uncloud-voice]
    validation: pnpm lint

  - id: engineering-skills
    repository: companionintelligence/CI-Engineering
    ref: main
    paths: [.cursor/skills, tools/fleet-qa/skills]
    skills: [ci-engineering, latex-pdf, run-fleet-qa]
    validation: repository-specific

  - id: hermes-runtime-skill
    repository: companionintelligence/CI-Hermes
    ref: master
    paths: [ci-context/skills]
    skills: [ci]
    validation: hermes doctor

  - id: openclaw-runtime-and-memory
    repository: companionintelligence/CI-OpenClaw
    ref: master
    paths: [openclaw-context/plugins/ci-runtime/skills]
    skills: [ci]
    validation: openclaw doctor --deep --non-interactive

native_stores:
  claude:
    path: ~/.claude/skills
    validation: claude plugin validate ~/.claude/skills
    observed_count: 22
  codex:
    path: managed by Codex desktop
    sync: do_not_copy_app_state
  openclaw:
    path: ~/.openclaw/skills
    sync: use plugin/package installation, not raw state copies
  hermes:
    path: ~/.hermes/skills
    sync: use Hermes registry and reviewed local entries
  vscode:
    path: ~/.vscode/agent-plugins
    sync: use the agent plugin UI; record reviewed sources here
