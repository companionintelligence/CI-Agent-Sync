version: 1

policy:
  source: reviewed_repository_or_native_agent_store
  install_mode: audit_then_explicit_install
  copy_native_state: false
  trust: read_skill_instructions_before_execution

# Skills every harness should carry by default. Installs stay audit-then-explicit:
# `agentctl validate` only checks that each harness has a declared install path.
default_skills:
  - id: humanizer
    repository: blader/humanizer
    license: MIT
    # Pin to a reviewed commit; bump only after reading the new SKILL.md.
    pinned_commit: 8c307f367c91bd974002f10f2be2965d642c13df
    skill_file: SKILL.md
    purpose: Rewrite AI-sounding prose to read as human-written without changing meaning
    review: read SKILL.md before install; it is prose guidance only and must not run scripts without approval
    installs:
      claude: /plugin marketplace add blader/humanizer, then /plugin install humanizer@humanizer (Claude Code 2.1.142+); older versions use npx skills add blader/humanizer --global --agent claude-code
      codex: npx skills add blader/humanizer --global --agent codex
      opencode: copy SKILL.md to ~/.config/opencode/skills/humanizer/SKILL.md
      hermes: copy SKILL.md to ~/.hermes/skills/humanizer/SKILL.md
      openclaw: copy SKILL.md to ~/.openclaw/skills/humanizer/SKILL.md
      vscode: npx skills add blader/humanizer --global --agent github-copilot
      antigravity: npx skills add blader/humanizer --global --agent '*'
      pi: copy SKILL.md to ~/.pi/skills/humanizer/SKILL.md
      aider-desk: copy SKILL.md into the app's skills folder; verify the path in the app first
      chatgpt: download the repo ZIP and upload it as a skill in the app settings
    not_applicable: [ollama]

# Skills written in this repository, one folder each under skills/<id>/SKILL.md (index: skills/README.md).
# They are opt-in, not default skills. `installs` is a template for every skill below: replace {id}
# with the skill id and {commit} with the full SHA of the CI-Agent-Sync commit you reviewed. The
# skills CLI is pinned too: 1.9.0 reads owner/repo@<40-hex SHA> or @<version> as a ref and anything
# else after @ as a skill name, and other versions may differ, so move the pin only after reviewing the
# new CLI. From a reviewed checkout, the source `.` works in place of the GitHub pin.
# DISABLE_TELEMETRY=1 turns off the CLI's usage reporting, and 1.9.0 needs Node 22.20 or newer.
# Installs stay audit-then-explicit: read the SKILL.md first.
first_party_skills:
  source: companionintelligence/CI-Agent-Sync
  path: skills/{id}/SKILL.md
  license: PolyForm-Noncommercial-1.0.0
  installs:
    claude: DISABLE_TELEMETRY=1 npx skills@1.9.0 add companionintelligence/CI-Agent-Sync@{commit} --skill {id} --global --agent claude-code
    codex: DISABLE_TELEMETRY=1 npx skills@1.9.0 add companionintelligence/CI-Agent-Sync@{commit} --skill {id} --global --agent codex
    opencode: copy skills/{id}/SKILL.md to ~/.config/opencode/skills/{id}/SKILL.md
    hermes: copy skills/{id}/SKILL.md to ~/.hermes/skills/{id}/SKILL.md
    openclaw: copy skills/{id}/SKILL.md to ~/.openclaw/skills/{id}/SKILL.md
    vscode: DISABLE_TELEMETRY=1 npx skills@1.9.0 add companionintelligence/CI-Agent-Sync@{commit} --skill {id} --global --agent github-copilot
    antigravity: DISABLE_TELEMETRY=1 npx skills@1.9.0 add companionintelligence/CI-Agent-Sync@{commit} --skill {id} --global --agent antigravity
    pi: copy skills/{id}/SKILL.md to ~/.pi/skills/{id}/SKILL.md
    aider-desk: copy skills/{id}/SKILL.md into the app's skills folder; verify the path in the app first
    chatgpt: download the repo ZIP and upload skills/{id} as a skill in the app settings
  not_applicable: [ollama]
  skills:
    - id: spec-first
      path: skills/spec-first/SKILL.md
      purpose: The umbrella for spec-first work. The .agent-configs/specs.toml registry, the status ladder, choosing a tool by kind of rule, the six-step agent loop, agentctl spec, evidence rules and the PR verification block.
    - id: quint-spec
      path: skills/quint-spec/SKILL.md
      purpose: Model protocols, lifecycles and races in Quint 0.34.0. Invariants and observations, typecheck, run, test, bounded verify on a per-run Apalache port, QUINT_HOME and replaying ITF traces against TypeScript code.
    - id: lemmascript-proof
      path: skills/lemmascript-proof/SKILL.md
      purpose: Prove small pure TypeScript decision functions in place with LemmaScript 0.6.14 and Dafny 4.11.0, with unread-annotations at error and the gates CI owns.
    - id: dafny-reference-model
      path: skills/dafny-reference-model/SKILL.md
      purpose: Write Dafny 4.11.0 reference models, audit .dfy files against a baseline, and use generated JavaScript only as a test oracle.
    - id: effect-schema-contract
      path: skills/effect-schema-contract/SKILL.md
      purpose: Data contracts at boundaries with effect 4.1.6 Schema. Subpath imports, decoding with every error, a sound JSON Schema export, Standard Schema interop and effect/Arbitrary properties.
    - id: storybook-contract
      path: skills/storybook-contract/SKILL.md
      purpose: Component contracts with Storybook 10.6.9 and the Vitest addon. Play functions, axe at error, telemetry off, exact pins after init and no Chromatic.
    - id: bombadil-property
      path: skills/bombadil-property/SKILL.md
      purpose: Temporal properties of web UIs with Bombadil 0.8.0. Extractors, weighted actions, real and virtual time, reachability witnesses and no secrets in tool arguments.
    - id: doc-claim-binding
      path: skills/doc-claim-binding/SKILL.md
      purpose: Never type a product fact by hand. Cite a spec id, claim id or test, and check claims before a docs push.

# Upstream skills worth reading beside the first-party ones, recorded at the commit that was read.
# Reference only: none is a default skill and none is copied into this repository. Review the
# upstream diff before moving a pin.
upstream_skill_references:
  - id: quint-lang
    repository: quint-co/quint
    path: skills/quint-lang/SKILL.md
    pinned_commit: 95141d4691cce7e60104bdfcbc1d1b074f1cb789
    license: Apache-2.0
    used_by: [quint-spec]
    install: gh skill install quint-co/quint quint-lang --pin 95141d4691cce7e60104bdfcbc1d1b074f1cb789 --agent claude-code --scope user
    notes: Language and CLI reference. The skills folder last changed at 389cf78 (2026-11-02), before Quint 0.34.0, so it still teaches --witnesses and says piped REPL input needs the TypeScript backend. The quint-llm-kit ships older skills with the same names; do not install both.
  - id: quint-modeling
    repository: quint-co/quint
    path: skills/quint-modeling/SKILL.md
    pinned_commit: 95141d4691cce7e60104bdfcbc1d1b074f1cb789
    license: Apache-2.0
    used_by: [quint-spec]
    install: gh skill install quint-co/quint quint-modeling --pin 95141d4691cce7e60104bdfcbc1d1b074f1cb789 --agent claude-code --scope user
    notes: Modelling flows from code, requirements or TLA+, and a review checklist. Same 0.34.0 caveats as quint-lang.
  - id: effect-ts
    repository: Effect-TS/skills
    path: skills/effect-ts/SKILL.md
    pinned_commit: 155c50c911f9c99c294ef8a4461981c5bbe6453e
    license: MIT
    used_by: [effect-schema-contract]
    install: DISABLE_TELEMETRY=1 npx skills@1.9.0 add Effect-TS/skills@155c50c911f9c99c294ef8a4461981c5bbe6453e --skill effect-ts --global --agent claude-code
    notes: Its step 1 installs effect@latest and step 2 edits AGENTS.md and CLAUDE.md. Keep the exact effect 4.1.6 pin and leave agent files to sync; take only the advice to read node_modules/effect/AGENTS.md.
  - id: effect-v3-to-v4
    repository: Effect-TS/skills
    path: skills/effect-v3-to-v4/SKILL.md
    pinned_commit: 155c50c911f9c99c294ef8a4461981c5bbe6453e
    license: MIT
    used_by: [effect-schema-contract]
    notes: A bounded v3 to v4 migration workflow driven by the migration notes in the Effect repository. Only for repositories that already use Effect 3.
  - id: storybook-11-skills
    repository: storybookjs/storybook
    path: code/lib/claude-plugin/skills
    pinned_commit: 7bfb4ca1d4bc2e74f7b1a60a2b220eb9cfd2e8eb
    license: MIT
    used_by: [storybook-contract]
    notes: The seven skills that Storybook 11.0.0-rc.1 installs, in the MIT monorepo at tag v11.0.0-rc.1. They describe 11.x; do not use them while repositories pin 10.6.9. The storybookjs/skills repository that `storybook upgrade` fetches them from has no licence.
  - id: lemmascript-skills
    repository: midspiral/lemmascript-skills
    pinned_commit: ddd73a1fe6a2fb9d587efa9ec0427e28833a0d2f
    license: none
    used_by: [lemmascript-proof]
    notes: No licence file and no licence statement. Link to it only; never copy or adapt its text into this repository.

sources:
  - id: companion-hub-agent-skills
    repository: companionintelligence/Companion-Hub
    ref: dev
    paths:
      - .claude/skills
      - .cursor/skills
    skills: [agent-workflow, agent-loop, agent-sweep, test-audit, visual-regression, hot-swap]
    validation: bin/agent-validate-shift

  - id: companion-memory-agent-skills
    repository: companionintelligence/Companion-Memory
    ref: main
    paths: [.cursor/skills]
    skills: [hot-swap]
    validation: make check

  - id: common-design-skills
    repository: companionintelligence/CI-Common
    ref: main
    paths: [.claude/skills, content/skills]
    skills: [ci-design-canon, uncloud-voice]
    validation: pnpm lint

  - id: engineering-skills
    repository: companionintelligence/CI-Engineering
    ref: main
    paths: [.cursor/skills, tools/fleet-qa/skills]
    skills: [ci-engineering, latex-pdf, run-fleet-qa]
    validation: repository-specific

  - id: hermes-runtime-skill
    repository: companionintelligence/CI-Hermes
    ref: master
    paths: [ci-context/skills]
    skills: [ci]
    validation: hermes doctor

  - id: openclaw-runtime-and-memory
    repository: companionintelligence/CI-OpenClaw
    ref: master
    paths: [openclaw-context/plugins/ci-runtime/skills]
    skills: [ci]
    validation: openclaw doctor --deep --non-interactive

native_stores:
  claude:
    path: ~/.claude/skills
    validation: claude plugin validate ~/.claude/skills
    observed_count: 22
  codex:
    path: managed by Codex desktop
    sync: do_not_copy_app_state
  openclaw:
    path: ~/.openclaw/skills
    sync: use plugin/package installation, not raw state copies
  hermes:
    path: ~/.hermes/skills
    sync: use Hermes registry and reviewed local entries
  vscode:
    path: ~/.vscode/agent-plugins
    sync: use the agent plugin UI; record reviewed sources here
