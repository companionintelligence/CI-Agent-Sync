version: 1

# Portable credential references. These are pointers only; no credential value
# belongs in this repository. Items are created by agent-store after the user
# authenticates the 1Password CLI.
backend:
  name: 1password
  binary: op
  vault_env: AGENT_CONFIGS_OP_VAULT
  default_vault: Agent Configs
  account_env: OP_ACCOUNT
  desktop_app_integration: true
  native_fallback: explicit_or_migration_only
  item_tag: agent-configs
  field: credential

providers:
  anthropic:
    env: ANTHROPIC_API_KEY
    item: agent-configs-anthropic
    reference: "op://Agent Configs/agent-configs-anthropic/credential"
  openai:
    env: OPENAI_API_KEY
    item: agent-configs-openai
    reference: "op://Agent Configs/agent-configs-openai/credential"
  openrouter:
    env: OPENROUTER_API_KEY
    item: agent-configs-openrouter
    reference: "op://Agent Configs/agent-configs-openrouter/credential"
  ollama:
    env: OLLAMA_API_KEY
    item: agent-configs-ollama
    reference: "op://Agent Configs/agent-configs-ollama/credential"
  omlx:
    env: OMLX_API_KEY
    item: agent-configs-omlx
    reference: "op://Agent Configs/agent-configs-omlx/credential"
  companion-hub:
    env: COMPANION_HUB_API_KEY
    item: agent-configs-companion-hub
    reference: "op://Agent Configs/agent-configs-companion-hub/credential"
    purpose: MCP tool discovery and calls
    scope: mcp
  companion-hub-qa:
    env: COMPANION_HUB_QA_API_KEY
    item: agent-configs-companion-hub-qa
    reference: "op://Agent Configs/agent-configs-companion-hub-qa/credential"
    purpose: read-only Hub control-room and fleet checks
    scope: qa:read
  companion-hub-inference:
    env: COMPANION_HUB_INFERENCE_API_KEY
    item: agent-configs-companion-hub-inference
    reference: "op://Agent Configs/agent-configs-companion-hub-inference/credential"
    purpose: OpenAI-compatible Hub model endpoint
    scope: inference
  companion-memory:
    env: COMPANION_MEMORY_API_KEY
    item: agent-configs-companion-memory
    reference: "op://Agent Configs/agent-configs-companion-memory/credential"
  omniroute:
    env: OMNIROUTE_API_KEY
    item: agent-configs-omniroute
    reference: "op://Agent Configs/agent-configs-omniroute/credential"
  android-mcp:
    env: ANDROID_MCP_TOKEN
    item: agent-configs-android-mcp
    reference: "op://Agent Configs/agent-configs-android-mcp/credential"
  cloudflare:
    env: CLOUDFLARE_API_TOKEN
    item: agent-configs-cloudflare
    reference: "op://Agent Configs/agent-configs-cloudflare/credential"
    purpose: Wrangler API-token deployment path; scope to named account/targets
    scope: target_specific

rotation:
  never_print_values: true
  keep_native_source_until_verified: true
  remove_native_only_with_explicit_flag: true
  verify_with: ./bin/agentctl credentials status
