version: 1

# Non-secret provider metadata. Credentials are resolved from 1Password first,
# with native stores retained only as an explicit migration fallback.
credential_backend:
  primary: 1password
  reference_catalog: providers/onepassword.yaml
  native_migration_source: macos-keychain-or-linux-secret-service
  never_copy_to_git: true

providers:
  anthropic:
    aliases: [claude]
    env: ANTHROPIC_API_KEY
    keychain_service: agent-configs/anthropic
    primary_clients: [claude, hermes, opencode, aider-desk, pi]

  openai:
    aliases: [codex]
    env: OPENAI_API_KEY
    keychain_service: agent-configs/openai
    primary_clients: [codex, hermes, openclaw, opencode, aider-desk, pi]

  openrouter:
    aliases: []
    env: OPENROUTER_API_KEY
    keychain_service: agent-configs/openrouter
    primary_clients: [hermes, opencode, aider-desk, pi]

  ollama:
    aliases: [ollama-cloud]
    env: OLLAMA_API_KEY
    keychain_service: agent-configs/ollama
    endpoint_env: OLLAMA_HOST
    primary_clients: [hermes, openclaw, opencode, aider-desk, pi]

  omlx:
    aliases: [mlx, omlx-local]
    env: OMLX_API_KEY
    keychain_service: agent-configs/omlx
    endpoint_env: OMLX_BASE_URL
    default_endpoint: http://127.0.0.1:8000/v1
    primary_clients: [hermes, openclaw, opencode, aider-desk, pi]

  companion-hub:
    aliases: [companion_hub, companionhub]
    env: COMPANION_HUB_API_KEY
    env_aliases: [CI_SERVER_TOKEN]
    keychain_service: agent-configs/companion-hub
    endpoint_env: COMPANION_HUB_BASE_URL
    endpoint_env_aliases: [CI_SERVER_URL]
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode]

  companion-hub-qa:
    aliases: [companion_hub_qa, hub-qa, hub-qa-read]
    env: COMPANION_HUB_QA_API_KEY
    keychain_service: agent-configs/companion-hub-qa
    endpoint_env: COMPANION_HUB_BASE_URL
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode]
    scope: qa:read
    capability: read

  companion-hub-inference:
    aliases: [companion_hub_inference, hub-inference]
    env: COMPANION_HUB_INFERENCE_API_KEY
    keychain_service: agent-configs/companion-hub-inference
    endpoint_env: COMPANION_HUB_BASE_URL
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode]
    scope: inference
    capability: read

  companion-hub-fleet-qa:
    aliases: [companion_hub_fleet_qa, fleet-qa, hub-fleet-qa]
    env: FLEET_HUB_API_KEYS_JSON
    keychain_service: agent-configs/companion-hub-fleet-qa
    endpoint_env: COMPANION_HUB_BASE_URL
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode, aider-desk, pi, antigravity]
    scope: qa:read
    capability: read
    format: json_map

  companion-memory:
    aliases: [companion_memory, ci-memory, memory]
    env: COMPANION_MEMORY_API_KEY
    keychain_service: agent-configs/companion-memory
    endpoint_env: COMPANION_MEMORY_BASE_URL
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode]

  companion-memory-cli:
    aliases: [companion_memory_cli, ci-memory-cli, memory-cli]
    env: CI_API_KEY
    env_aliases: [CI_SERVER_API_KEY]
    keychain_service: agent-configs/companion-memory-cli
    endpoint_env: COMPANION_MEMORY_BASE_URL
    primary_clients: [hermes, openclaw, claude, codex, opencode, vscode]
    scope: full_user_cli
    capability: full

  omniroute:
    aliases: [omni-route]
    env: OMNIROUTE_API_KEY
    keychain_service: agent-configs/omniroute
    endpoint_env: OMNIROUTE_BASE_URL
    primary_clients: [opencode, claude, codex, hermes, openclaw, vscode]

  android-mcp:
    aliases: [android, android-remote-control]
    env: ANDROID_MCP_TOKEN
    keychain_service: agent-configs/android-mcp
    primary_clients: [claude, codex, opencode, vscode, hermes, openclaw, antigravity]

  cloudflare:
    aliases: [wrangler, cloudflare-deploy]
    env: CLOUDFLARE_API_TOKEN
    keychain_service: agent-configs/cloudflare
    primary_clients: [claude, codex, hermes, openclaw, opencode, vscode, aider-desk, pi, antigravity]
    class: deployment
    scope: target_specific
    capability: deploy
