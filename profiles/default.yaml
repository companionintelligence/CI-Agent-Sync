version: 1
name: default

providers:
  source: 1password-first
  reference_catalog: providers/onepassword.yaml
  native_fallback: explicit-migration-only
  namespace: agent-configs

integrations:
  credential_catalog: providers/onepassword.yaml
  routing: integrations/providers/routing.yaml
  mcp_registry: integrations/mcp/registry.yaml
  capability_bundles: integrations/capability-bundles.yaml
  harness_inventory: integrations/harnesses.yaml
  skills_registry: integrations/skills.yaml
  plugins_registry: integrations/plugins.yaml
  hub_operator: integrations/hub-operator.yaml
  fleet_qa: integrations/fleet-qa.yaml
  repository_manifest: repos/companionintelligence.yaml
  workspace_manifest: repos/workspace.yaml

operations:
  control_plane: ./bin/agentctl
  render: ./bin/agent-store render
  doctor: ./bin/agent-store doctor
  doctor_json: ./bin/agent-store doctor --json
  test: ./bin/agentctl test
  test_live_local: ./bin/agentctl test --live-local
  backup: ./bin/agentctl backup
  install: ./bin/agentctl install
  repository_sync_plan: ./bin/agent-store repos sync
  repository_sync_apply: ./bin/agent-store repos sync --apply
  hub_control_room: ./bin/agentctl hub smoke --json --strict --from-1password
  memory_control_room: ./bin/agentctl memory smoke --json --strict --from-1password
  fleet_smoke: ./bin/agentctl fleet smoke --json --strict
  deployment_doctor: ./bin/agentctl deploy doctor --json
  platform_qa_workflow: workflows/platform-qa.md

agents:
  hermes:
    command: hermes
    config: ~/.hermes/config.yaml
    env_file: ~/.hermes/.env
    audit: hermes doctor
  openclaw:
    command: openclaw
    config: ~/.openclaw/openclaw.json
    env_file: ~/.openclaw/.env
    audit: openclaw doctor --deep --non-interactive
  claude:
    command: claude
    config: ~/.claude
    audit: claude --help
  chatgpt:
    command: desktop app
    app: /Applications/ChatGPT.app
    config: ~/Library/Application Support/com.openai.chat
    audit: desktop-only; hosted account state stays native
  codex:
    command: codex
    config: ~/.codex
    audit: codex --help
  antigravity:
    command: desktop app
    app: /Applications/Antigravity.app
    config: ~/.gemini/antigravity
    audit: desktop-only
  opencode:
    command: opencode
    config: ~/.config/opencode/opencode.jsonc
    audit: opencode --help
  ollama:
    command: ollama
    config: ~/.ollama
    audit: ollama list
  aider-desk:
    command: desktop app
    app: /Applications/aider-desk.app
    config: ~/Library/Application Support/aider-desk
    audit: desktop-only
  pi:
    command: desktop app
    app: /Applications/pi-gui.app
    config: ~/.pi
    audit: command-or-desktop-only
