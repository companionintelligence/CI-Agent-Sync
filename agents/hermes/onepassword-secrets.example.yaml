# Merge this block into the active Hermes profile config after the shared
# Agent Configs vault has been created. It contains references only.
secrets:
  sources: [onepassword]
  onepassword:
    enabled: true
    account: ""
    binary_path: ""
    service_account_token_env: OP_SERVICE_ACCOUNT_TOKEN
    override_existing: true
    env:
      ANTHROPIC_API_KEY: "op://Agent Configs/agent-configs-anthropic/credential"
      OPENAI_API_KEY: "op://Agent Configs/agent-configs-openai/credential"
      OPENROUTER_API_KEY: "op://Agent Configs/agent-configs-openrouter/credential"
      OLLAMA_API_KEY: "op://Agent Configs/agent-configs-ollama/credential"
      OMLX_API_KEY: "op://Agent Configs/agent-configs-omlx/credential"
      COMPANION_HUB_API_KEY: "op://Agent Configs/agent-configs-companion-hub/credential"
      FLEET_HUB_API_KEYS_JSON: "op://Agent Configs/agent-configs-companion-hub-fleet-qa/credential"
      COMPANION_MEMORY_API_KEY: "op://Agent Configs/agent-configs-companion-memory/credential"
      OMNIROUTE_API_KEY: "op://Agent Configs/agent-configs-omniroute/credential"
      ANDROID_MCP_TOKEN: "op://Agent Configs/agent-configs-android-mcp/credential"
