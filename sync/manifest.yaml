version: 1

# The distribution catalog is deliberately separate from native client state.
# Only files listed here may be copied into a target repository.
policy:
  default_groups: [shared]
  mode: plan_then_apply
  target_policy_file: .agent-configs/sync.yml
  preserve_dirty_checkouts: true
  copy_native_state: false
  copy_credentials: false
  prune_requires_explicit_deletion: true

items:
  - id: shared/provider-routing
    version: 1
    source: integrations/providers/routing.yaml
    destination: .agent-configs/providers/routing.yaml
    groups: [shared]
    description: Provider routing policy without credentials

  - id: shared/provider-fallbacks
    version: 1
    source: integrations/providers/fallbacks.yaml
    destination: .agent-configs/providers/fallbacks.yaml
    groups: [shared]
    description: Explicit local-first fallback chains and mutation safety rules

  - id: shared/mcp-registry
    version: 1
    source: integrations/mcp/registry.yaml
    destination: .agent-configs/mcp/registry.yaml
    groups: [shared]
    description: Reviewed MCP recipes and safety policy

  - id: shared/capability-bundles
    version: 1
    source: integrations/capability-bundles.yaml
    destination: .agent-configs/capability-bundles.yaml
    groups: [shared]
    description: Portable reviewed MCP bundles and client defaults

  - id: shared/harness-inventory
    version: 1
    source: integrations/harnesses.yaml
    destination: .agent-configs/harnesses.yaml
    groups: [shared]
    description: Cross-platform harness discovery and smoke-test metadata

  - id: shared/skills-registry
    version: 1
    source: integrations/skills.yaml
    destination: .agent-configs/skills.yaml
    groups: [shared]
    description: Reviewed skill sources and validation commands

  - id: shared/plugins-registry
    version: 1
    source: integrations/plugins.yaml
    destination: .agent-configs/plugins.yaml
    groups: [shared]
    description: Reviewed plugin inventory and install notes

  - id: shared/portable-setup
    version: 1
    source: sync/target-README.md
    destination: .agent-configs/README.md
    groups: [shared]
    description: Target-side distribution and safety contract

  - id: shared/target-policy-template
    version: 1
    source: .agent-configs/sync.yml.example
    destination: .agent-configs/sync.yml.example
    groups: [shared]
    description: Per-target selection template

  - id: shared/marketing-video-workflow
    version: 1
    source: workflows/marketing-video.md
    destination: .agent-configs/workflows/marketing-video.md
    groups: [shared]
    description: Portable Brand Studio, CI-Common, CI-Engineering, and Metricool workflow

  - id: shared/harness-routing
    version: 1
    source: workflows/harness-routing.md
    destination: .agent-configs/workflows/harness-routing.md
    groups: [shared]
    description: Provider and handoff contract shared by local harnesses

  - id: shared/fleet-pool-policy
    version: 1
    source: integrations/fleet/pool-policy.yaml
    destination: .agent-configs/fleet/pool-policy.yaml
    groups: [shared]
    description: Plan-first CI-Hub fleet policy with explicit safety boundaries

  - id: shared/fleet-operations
    version: 1
    source: docs/fleet-operations.md
    destination: .agent-configs/docs/fleet-operations.md
    groups: [shared]
    description: Portable CI-Hub fleet repair and verification runbook

  - id: shared/agent-operating-context
    version: 1
    source: context/agent-operating-context.md
    destination: .agent-configs/context/agent-operating-context.md
    groups: [shared]
    description: Distilled cross-harness workspace and validation context

  - id: shared/harness-parity
    version: 1
    source: docs/harness-parity.md
    destination: .agent-configs/docs/harness-parity.md
    groups: [shared]
    description: Portable parity and test-tier contract

  - id: shared/recovery
    version: 1
    source: docs/recovery.md
    destination: .agent-configs/docs/recovery.md
    groups: [shared]
    description: Redacted backup, recovery, and OpenClaw repair runbook

  - id: shared/control-plane
    version: 1
    source: docs/control-plane.md
    destination: .agent-configs/docs/control-plane.md
    groups: [shared]
    description: Portable control-plane lifecycle and store separation

  - id: shared/aider-desk-mcp-template
    version: 1
    source: integrations/aider-desk/mcp-servers.json.example
    destination: .agent-configs/aider-desk/mcp-servers.json.example
    groups: [shared]
    description: Portable Aider Desk MCP template with machine-path placeholders

  - id: shared/references
    version: 1
    source: integrations/references.yaml
    destination: .agent-configs/references.yaml
    groups: [shared]
    description: Reviewed private planning and public implementation references

# Renames and removals are intentionally explicit. The sync command will not
# delete target files unless --prune is supplied and an entry exists here.
deletions: []
