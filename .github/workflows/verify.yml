name: Verify agent config store

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install TypeScript control-plane dependencies
        run: npm ci
      - name: Build TypeScript control plane and browser bundle
        run: npm run build
      - name: Verify scripts and secret hygiene
        run: ./scripts/verify.sh
