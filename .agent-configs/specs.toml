#:schema https://raw.githubusercontent.com/companionintelligence/CI-Agent-Sync/main/integrations/verification/specs.schema.json
# Spec registry: the formal and executable specifications this repo keeps.
# Format and commands: docs/verification.md. Check it with `./bin/agentctl spec validate`.
version = 1
repo = "CI-Agent-Sync"

[[spec]]
id = "spec-registry-schema"
title = "Spec registry: the TOML format, its cross-field rules and the generated JSON Schema"
kind = "data-contract"
tool = "effect-schema"
status = "checked"
gate = "required"
artefacts = ["src/spec-registry.ts", "src/spec-registry.test.ts", "integrations/verification/specs.schema.json"]
covers = ["src/spec-registry.ts", "integrations/verification/**"]
docs = ["docs/verification.md"]
requires = ["node", "effect"]
check = ["npm", "run", "--silent", "spec:registry"]
timeout_seconds = 60
properties = ["everyErrorAtItsPath", "crossFieldRulesInOnePass", "schemaFileMatchesSchema", "jsonSchemaAgreesWithDecoder"]
conformance = "The decoder in src/spec-registry.ts is the code agentctl runs. src/spec-registry.test.ts decodes valid and invalid registries with it, then runs the committed JSON Schema in a strict validator against the same kinds of registry."

[[spec]]
id = "sync-plan-model"
title = "Sync plan and apply: selection, skipped targets, backups and prune"
kind = "state-machine"
tool = "quint"
status = "planned"
covers = ["scripts/sync.rb", "sync/manifest.yaml"]
docs = ["sync/README.md"]
requires = ["node", "quint"]
target = "AS-SYNC-2"

[[spec]]
id = "store-schemas"
title = "Typed schemas for every YAML store file"
kind = "data-contract"
tool = "effect-schema"
status = "planned"
covers = ["src/validate.ts", "integrations/**", "providers/**", "profiles/**", "repos/**", "sync/**"]
docs = ["docs/control-plane.md"]
requires = ["node", "effect"]
target = "AS-SCHEMA-1"

[[spec]]
id = "path-containment"
title = "Path containment: a proved prefix decision, and tests that the wizard and sync stay inside their folder"
kind = "invariant"
tool = "lemmascript"
status = "conformance"
gate = "required"
artefacts = [
  "src/path-containment.ts",
  "src/path-containment.dfy.gen",
  "src/path-containment.dfy",
  "lemmascript.json",
  "LemmaScript-files.txt",
]
covers = [
  "src/path-containment.ts",
  "src/core.ts",
  "src/atlas-web.ts",
  "scripts/sync.rb",
  "scripts/path_containment.rb",
]
docs = ["sync/README.md", "docs/control-plane.md"]
requires = ["node", "lemmascript", "dafny"]
check = ["npm", "run", "--silent", "spec:containment"]
properties = ["childWithin_ensures", "containmentNests_ensures"]
conformance = "The proved childWithin in src/path-containment.ts is the code the wizard runs. src/test.ts checks it, sync's Ruby copy of the decision (PathContainment.within? in scripts/path_containment.rb) and the wizard's safeChildPath against independent references on generated paths. scripts/test_sync.rb checks sync's symbolic-link walk (PathContainment.refusal) and sync's writes on generated file trees and target checkouts: each target is refused and left unchanged, or gets exactly the manifest's files and deletions, and nothing outside the targets changes. Every generator uses a fixed seed."
target = "AS-SYNC-1"
notes = "Proved under LemmaScript's javascript-utf16 string model, so strings are UTF-16 code units as in JavaScript, and with the type-system options that Dafny's main branch has made the default. The proof covers only the string decision on absolute, normalised paths. The wizard resolves a request with node:path and, when the path exists, compares real paths. Sync does not resolve symbolic links: it refuses a target when a path it would use leads through one, then compares real paths. That walk and sync's writes are not proved; the property tests in scripts/test_sync.rb check them. A base of / contains only itself, so a caller that passes the file-system root fails closed: it refuses every other path."
